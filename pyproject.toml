[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smbhost"
version = "0.1.0"
description = "Auto-detects attached drives and exposes them as SMB shares with a web configuration UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "SMBHost Contributors"}]
keywords = ["smb", "samba", "nas", "file-sharing", "drive-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyudev>=0.24.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
]

[project.scripts]
smbhost = "smbhost.__main__:main"

[project.urls]
Homepage = "https://github.com/example/smbhost"
Issues = "https://github.com/example/smbhost/issues"

[tool.setuptools.packages.find]
include = ["smbhost*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
